#Configurando o banco testedb
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=pablo
quarkus.datasource.password=testeglobalcode
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/testedb
quarkus.datasource.jdbc.driver=org.mariadb.jdbc.Driver

#configurando o hibernate orm (jpa)
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

#pool do db para limitar
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2

